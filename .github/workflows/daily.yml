name: Arsenal Daily Update

on:
  schedule:
    # UTC 20:30 = 日本時間 朝5:30 に自動実行（6時までに確実に完了させるため）
    - cron: '30 20 * * *'
  workflow_dispatch: # 手動で今すぐテスト実行するボタン

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install google-genai feedparser requests pytz markdown beautifulsoup4
      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Update daily Arsenal news" || exit 0
          git push
