name: Arsenal Daily Update

on:
  schedule:
    # 深夜 01:13 と 早朝 04:13 (JST) の2回実行（遅延しても朝6時前に完了）
    - cron: '13 16 * * *'
    - cron: '13 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install google-genai feedparser requests pytz markdown beautifulsoup4 cloudscraper
      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python main.py
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html history.json
          git commit -m "Update daily Arsenal hub and history" || exit 0
          git push
